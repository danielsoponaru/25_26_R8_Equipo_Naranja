input {
  file {
    path => "/home/daniel/Escritorio/subida_eslastic/Networkflows_100k.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  csv {
    separator => ","
    columns => ["Flow.ID", "Source.IP", "Source.Port", "Destination.IP", "Destination.Port", "Protocol", "Timestamp", "Flow.Duration", "Total.Fwd.Packets", "Total.Backward.Packets", "Total.Length.of.Fwd.Packets", "Total.Length.of.Bwd.Packets", "Fwd.Packet.Length.Max", "Fwd.Packet.Length.Min", "Fwd.Packet.Length.Mean", "Fwd.Packet.Length.Std", "Bwd.Packet.Length.Max", "Bwd.Packet.Length.Min", "Bwd.Packet.Length.Mean", "Bwd.Packet.Length.Std", "Flow.Bytes.s", "Flow.Packets.s", "Flow.IAT.Mean", "Flow.IAT.Std", "Flow.IAT.Max", "Flow.IAT.Min", "Fwd.IAT.Total", "Fwd.IAT.Mean", "Fwd.IAT.Std", "Fwd.IAT.Max", "Fwd.IAT.Min", "Bwd.IAT.Total", "Bwd.IAT.Mean", "Bwd.IAT.Std", "Bwd.IAT.Max", "Bwd.IAT.Min", "Fwd.PSH.Flags", "Bwd.PSH.Flags", "Fwd.URG.Flags", "Bwd.URG.Flags", "Fwd.Header.Length", "Bwd.Header.Length", "Fwd.Packets.s", "Bwd.Packets.s", "Min.Packet.Length", "Max.Packet.Length", "Packet.Length.Mean", "Packet.Length.Std", "Packet.Length.Variance", "FIN.Flag.Count", "SYN.Flag.Count", "RST.Flag.Count", "PSH.Flag.Count", "ACK.Flag.Count", "URG.Flag.Count", "CWE.Flag.Count", "ECE.Flag.Count", "Down.Up.Ratio", "Average.Packet.Size", "Avg.Fwd.Segment.Size", "Avg.Bwd.Segment.Size", "Fwd.Header.Length.1", "Fwd.Avg.Bytes.Bulk", "Fwd.Avg.Packets.Bulk", "Fwd.Avg.Bulk.Rate", "Bwd.Avg.Bytes.Bulk", "Bwd.Avg.Packets.Bulk", "Bwd.Avg.Bulk.Rate", "Subflow.Fwd.Packets", "Subflow.Fwd.Bytes", "Subflow.Bwd.Packets", "Subflow.Bwd.Bytes", "Init_Win_bytes_forward", "Init_Win_bytes_backward", "act_data_pkt_fwd", "min_seg_size_forward", "Active.Mean", "Active.Std", "Active.Max", "Active.Min", "Idle.Mean", "Idle.Std", "Idle.Max", "Idle.Min", "Label", "L7Protocol", "ProtocolName", "Source_Region", "Source_Latitude", "Source_Longitude", "Destination_Region", "Destination_Latitude", "Destination_Longitude"]
    skip_header => true
  }

  mutate {
    rename => { "Source.IP" => "source_ip" }
    rename => { "Destination.IP" => "dest_ip" }
    rename => { "Total.Length.of.Fwd.Packets" => "Length" }
    convert => {
      "Source_Latitude" => "float"
      "Source_Longitude" => "float"
      "Destination_Latitude" => "float"
      "Destination_Longitude" => "float"
      "Length" => "integer"
    }
  }

  if [Source_Latitude] and [Source_Longitude] {
    mutate { add_field => { "source_location" => "%{Source_Latitude},%{Source_Longitude}" } }
  }
  if [Destination_Latitude] and [Destination_Longitude] {
    mutate { add_field => { "destination_location" => "%{Destination_Latitude},%{Destination_Longitude}" } }
  }

  date {
    match => [ "Timestamp", "dd/MM/yyyyHH:mm:ss" ]
    target => "@timestamp"
  }

  ruby {
    code => "
      campos_ok = ['@timestamp', 'source_ip', 'dest_ip', 'Source.Port', 'Destination.Port', 'ProtocolName', 'Length', 'source_location', 'destination_location', 'Label']
      event.to_hash.keys.each do |k|
        event.remove(k) unless campos_ok.include?(k)
      end
    "
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "red-industrial-000001"
    user => "elastic"
    password => "HAA25Vh=goa1YSC7xz*X"
    ssl => true
    ssl_certificate_verification => false
  }
}
